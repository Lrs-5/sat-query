<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="terrain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2b1f"/>
      <stop offset="55%" stop-color="#223324"/>
      <stop offset="100%" stop-color="#182a2c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12313a"/>
      <stop offset="100%" stop-color="#0c2329"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#terrain)"/>

  <!-- river / water body -->
  <path d="M0 420 C 160 380, 260 470, 420 430 C 560 400, 640 460, 800 410 L800 520 C 640 560, 560 500, 420 530 C 260 560, 160 500, 0 540 Z" fill="url(#water)"/>

  <!-- field parcels -->
  <g stroke="#0d1a12" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="60" x2="800" y2="40"/>
    <line x1="0" y1="120" x2="800" y2="100"/>
    <line x1="0" y1="180" x2="800" y2="165"/>
    <line x1="120" y1="0" x2="140" y2="240"/>
    <line x1="260" y1="0" x2="280" y2="260"/>
    <line x1="400" y1="0" x2="410" y2="270"/>
    <line x1="540" y1="0" x2="560" y2="280"/>
    <line x1="680" y1="0" x2="690" y2="290"/>
  </g>

  <!-- built-up block clusters (urban area) -->
  <g fill="#3a3f38" stroke="#4d534a" stroke-width="0.5">
    <rect x="330" y="300" width="26" height="18"/>
    <rect x="362" y="296" width="20" height="22"/>
    <rect x="388" y="308" width="30" height="16"/>
    <rect x="340" y="326" width="22" height="14"/>
    <rect x="368" y="330" width="26" height="18"/>
    <rect x="300" y="320" width="18" height="20"/>
    <rect x="404" y="330" width="22" height="16"/>
    <rect x="420" y="300" width="18" height="24"/>
  </g>
  <g fill="#464c43" stroke="#585e54" stroke-width="0.5">
    <rect x="500" y="360" width="24" height="18"/>
    <rect x="528" y="356" width="18" height="22"/>
    <rect x="550" y="368" width="26" height="16"/>
    <rect x="510" y="386" width="20" height="14"/>
  </g>

  <!-- roads -->
  <g stroke="#5b5a4f" stroke-width="3" fill="none" opacity="0.75">
    <path d="M0 340 L 800 300"/>
    <path d="M280 0 L 340 600"/>
  </g>

  <!-- vegetation texture -->
  <g fill="#233a26" opacity="0.5">
    <circle cx="120" cy="140" r="30"/>
    <circle cx="160" cy="120" r="22"/>
    <circle cx="640" cy="120" r="34"/>
    <circle cx="600" cy="150" r="20"/>
    <circle cx="700" cy="480" r="26"/>
  </g>

  <!-- subtle scanline texture, evokes a raster/satellite pass -->
  <g stroke="#000000" stroke-opacity="0.05">
    <line x1="0" y1="0" x2="800" y2="0"/>
    <line x1="0" y1="20" x2="800" y2="20"/>
    <line x1="0" y1="40" x2="800" y2="40"/>
  </g>
</svg>
